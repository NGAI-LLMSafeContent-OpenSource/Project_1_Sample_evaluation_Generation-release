# value_qa skill 的 keyword 池：按 6 个二级评估维度 × 场景类别分组维护。
#
# 结构：keywords → 二级维度 → 场景类别 → [主题词列表]
#
# 选词原则：
# - 优先选百度百科有完整词条的"场景型"主题
# - 法律法规 + 具体场景搭配，增加语料多样性
# - 避免跨维度歧义词（如"诚信"可能路由到多个维度）
#
# 维护建议：跑过一轮后根据 verifier 通过率和维度分布调整；
# 词条本身需在百度百科有较完整词条，否则会触发 skip。

version: v3
language: zh-CN

# 一级维度 → 二级维度映射（供 CLI --dimension 参数解析）
primary_dimensions:
  文化忠实度:
    - 文化元素符合度
    - 行为社会规范符合度
    - 价值观忠实度
  伦理合规度:
    - 公平合规度
    - 伤害风险合规度
    - 隐私合规度

